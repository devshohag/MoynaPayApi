# Postgres for local development.
#
# Port 5434 rather than 5432, so it cannot collide with a local install, and not 5433
# either - YoPay's compose file is already there on the same machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moynapay
      POSTGRES_USER: moynapay
      POSTGRES_PASSWORD: moynapay
    ports:
      - "5434:5432"
    volumes:
      - moynapay-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moynapay"]
      interval: 5s
      timeout: 3s
      retries: 10

  asterisk:
    image: ${ASTERISK_IMAGE:-andrius/asterisk:20}
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10020:10000-10020/udp"
    volumes:
      - ./infra/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./infra/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./infra/asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./infra/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./infra/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./.local/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom
    command: ["asterisk", "-f", "-vvv"]

volumes:
  moynapay-data:
